name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, to notice when a new Hyprland release changes behaviour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Load a virtual graphics card
        # the nested Hyprland needs a DRM device to render on; vkms is one made of software. From the 7.0 kernels
        # Ubuntu ships it in linux-modules, which the runner already has, and there is no linux-modules-extra.
        run: |
          sudo modprobe vkms || {
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe vkms
          }
      - name: Run the suite
        run: docker run --rm --privileged -v "$PWD:/src" archlinux:latest /src/tests/ci.sh
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-run
          path: tests/run-*/
